<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Blog CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8fafc; --surface: #fff; --text: #0f172a; --text-muted: #64748b; --accent: #0ea5e9; --accent-hover: #0284c7; --border: #e2e8f0; --danger: #ef4444; --font-sans: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.07); }
    .logo { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text); margin-bottom: 20px; }
    .logo span { color: var(--accent); }
    h2 { font-size: 1.25rem; margin-bottom: 8px; }
    .hint { font-size: .875rem; color: var(--text-muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; font-family: var(--font-mono); }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: .9rem; font-family: var(--font-sans); color: var(--text); transition: border-color .15s; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.1); }
    .btn { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); transition: background .15s; margin-top: 20px; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { font-size: .85rem; margin-top: 14px; padding: 10px 14px; border-radius: 6px; display: none; }
    .msg-success { background: rgba(16,185,129,.1); color: #065f46; border: 1px solid #a7f3d0; }
    .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .invalid-token { text-align: center; padding: 20px; }
    .invalid-token p { color: var(--text-muted); margin-bottom: 16px; }
    .back-link { display: inline-block; color: var(--accent); font-size: .875rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>></span> Blog CMS</div>
    <div id="formWrapper">
      <h2>Set new password</h2>
      <p class="hint">Choose a strong password with at least 8 characters.</p>
      <form id="form">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn" id="btn">Set Password</button>
      </form>
      <div class="msg msg-success" id="successMsg"></div>
      <div class="msg msg-error" id="errorMsg"></div>
    </div>
    <div class="invalid-token" id="invalidToken" style="display:none">
      <p>This reset link is invalid or has expired.</p>
      <a href="/forgot-password" class="back-link">Request a new link →</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('formWrapper').style.display = 'none';
      document.getElementById('invalidToken').style.display = 'block';
    }

    document.getElementById('form')?.addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const cf = document.getElementById('confirm').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('errorMsg');
      const ok = document.getElementById('successMsg');

      if (pw !== cf) {
        err.textContent = 'Passwords do not match'; err.style.display = 'block'; return;
      }
      btn.disabled = true; btn.textContent = 'Updating…';
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json();
      if (res.ok) {
        ok.textContent = data.message + ' Redirecting to login…';
        ok.style.display = 'block'; err.style.display = 'none';
        setTimeout(() => window.location.href = '/login', 2500);
      } else {
        err.textContent = data.error || 'Failed to reset password';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Set Password';
      }
    });
  </script>
</body>
</html>
