<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Blog CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --surface: #fff; --text: #0f172a; --text-muted: #64748b;
      --accent: #0ea5e9; --accent-hover: #0284c7; --border: #e2e8f0;
      --danger: #ef4444; --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px; width: 100%; max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .logo {
      font-family: var(--font-mono); font-size: 1.25rem; font-weight: 500;
      color: var(--text); margin-bottom: 8px;
    }
    .logo span { color: var(--accent); }
    .subtitle { font-size: .875rem; color: var(--text-muted); margin-bottom: 32px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; font-family: var(--font-mono); }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: .9rem; font-family: var(--font-sans);
      color: var(--text); background: var(--surface); transition: border-color .15s;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.1); }
    .btn {
      width: 100%; padding: 11px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: .9rem; font-weight: 600;
      cursor: pointer; font-family: var(--font-sans); transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { font-size: .82rem; color: var(--danger); margin-top: 12px; text-align: center; display: none; }
    .forgot-link { display: block; text-align: center; margin-top: 16px; font-size: .82rem; color: var(--text-muted); }
    .forgot-link a { color: var(--accent); }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo"><span>></span> Blog CMS</div>
    <p class="subtitle">Sign in to manage your blog</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="error-msg" id="errorMsg"></p>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>
    <p class="forgot-link"><a href="/forgot-password">Forgot your password?</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/admin';
      } else {
        err.textContent = data.error || 'Login failed';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
