<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Blog CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8fafc; --surface: #fff; --text: #0f172a; --text-muted: #64748b; --accent: #0ea5e9; --accent-hover: #0284c7; --border: #e2e8f0; --success: #10b981; --font-sans: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.07); }
    .logo { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text); margin-bottom: 6px; }
    .logo span { color: var(--accent); }
    h2 { font-size: 1.25rem; margin-bottom: 8px; }
    p { font-size: .875rem; color: var(--text-muted); margin-bottom: 24px; }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; font-family: var(--font-mono); }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: .9rem; font-family: var(--font-sans); color: var(--text); transition: border-color .15s; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.1); }
    .btn { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); transition: background .15s; margin-top: 20px; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { font-size: .85rem; margin-top: 14px; padding: 10px 14px; border-radius: 6px; display: none; }
    .msg-success { background: rgba(16,185,129,.1); color: #065f46; border: 1px solid #a7f3d0; }
    .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: .82rem; color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>></span> Blog CMS</div>
    <br>
    <h2>Reset password</h2>
    <p>Enter your account email and we'll send you a reset link.</p>
    <form id="form">
      <label for="email">Email address</label>
      <input type="email" id="email" required autofocus>
      <button type="submit" class="btn" id="btn">Send Reset Link</button>
    </form>
    <div class="msg msg-success" id="successMsg"></div>
    <div class="msg msg-error" id="errorMsg"></div>
    <a href="/login" class="back-link">← Back to login</a>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Sending…';
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('successMsg').textContent = data.message;
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
        btn.textContent = 'Sent';
      } else {
        document.getElementById('errorMsg').textContent = data.error || 'Something went wrong';
        document.getElementById('errorMsg').style.display = 'block';
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
