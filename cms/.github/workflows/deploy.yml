name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: blog-cms
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/blog-cms

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and push image
        working-directory: cms
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "\
              JWT_SECRET=blog-cms-jwt-secret:latest,\
              SCHEDULER_SECRET=blog-cms-scheduler-secret:latest,\
              SMTP_HOST=blog-cms-smtp-host:latest,\
              SMTP_PORT=blog-cms-smtp-port:latest,\
              SMTP_USER=blog-cms-smtp-user:latest,\
              SMTP_PASS=blog-cms-smtp-pass:latest,\
              EMAIL_FROM=blog-cms-email-from:latest,\
              BLOG_TITLE=blog-cms-blog-title:latest,\
              BLOG_DESCRIPTION=blog-cms-blog-desc:latest,\
              GCP_PROJECT_ID=blog-cms-project-id:latest,\
              GCS_BUCKET_NAME=blog-cms-gcs-bucket:latest"

      - name: Show service URL
        run: |
          gcloud run services describe $SERVICE --region $REGION \
            --format 'value(status.url)'
